version: "3.9"

services:
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    env_file: .env
    command: http host.docker.internal:8428
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"  # для доступа к ngrok API
    networks:
      - default

  updater:
    image: python:3.11-slim
    container_name: ngrok-env-updater
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - ngrok
    entrypoint: ["sh", "-c", "pip install requests python-dotenv && python set_ngrok_env.py"]
    networks:
      - default

  app:
    build: .
    container_name: fastapi-audio
    depends_on:
      - updater
    ports:
      - "8428:8428"
    volumes:
      - ./data:/data
      - ./.env:/app/.env  # Монтируем .env в контейнер
    networks:
      - default
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8428"]

networks:
  default: